name: BrightShip CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: brightship

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: brightship_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create test database tables
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U test_user \
            -d brightship_test \
            -f database/schema.sql

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: brightship_test
          DB_USER: test_user
          DB_PASSWORD: test_password
        run: npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship
          push: true
          tags: ghcr.io/saheedtijani0912-sys/brightship-tracker:${{ github.sha }}

      - name: Build and push Postgres image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship
          file: ./brightship/Dockerfile.postgres
          push: true
          tags: ghcr.io/saheedtijani0912-sys/brightship-postgres:${{ github.sha }}

      - name: Trigger Portainer staging deployment
        env:
          PORTAINER_STAGING_WEBHOOK: ${{ secrets.PORTAINER_STAGING_WEBHOOK }}
        run: |
          curl -fsS -X POST "$PORTAINER_STAGING_WEBHOOK"

  production:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy to production
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > production-key.pem
          chmod 600 production-key.pem

          ssh -o StrictHostKeyChecking=no \
            -i production-key.pem \
            ubuntu@"$EC2_HOST" << EOF

            set -e

            IMAGE_TAG="${{ github.sha }}"

            echo "Deploying $IMAGE_TAG to production..."

            SECRET_JSON=\$(aws secretsmanager get-secret-value \
              --secret-id brightship/production/database \
              --query SecretString \
              --output text)

            export IMAGE_TAG="\$IMAGE_TAG"
            export DB_HOST=\$(echo "\$SECRET_JSON" | jq -r '.DB_HOST')
            export DB_NAME=\$(echo "\$SECRET_JSON" | jq -r '.DB_NAME')
            export DB_USER=\$(echo "\$SECRET_JSON" | jq -r '.DB_USER')
            export DB_PASSWORD=\$(echo "\$SECRET_JSON" | jq -r '.DB_PASSWORD')

            docker pull ghcr.io/saheedtijani0912-sys/brightship-tracker:\$IMAGE_TAG

            cd /home/ubuntu/brightship

            docker compose \
              -f docker-compose.production.yml \
              up -d

            docker ps

          EOF

          rm -f production-key.pem