 #version: "3.8"#

# This runs on both the prod server and the staging server
# They both use the same DB_HOST so be careful what you do in staging
# it will affect prod data — I know this is bad but we never fixed it
# - Kofi

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - .env.development
    environment:
      POSTGRES_DB: brightship_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: